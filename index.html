<!DOCTYPE html>
<html>
<head>
  <title>Web RDP Client</title>
  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      width:350px;
      background:#1e293b;
      padding:25px;
      border-radius:10px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>RDP Connect</h2>

  <input type="text" placeholder="IP Address">
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button>Connect</button>
</div>

</body>
</html>
